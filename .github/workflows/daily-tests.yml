name: Daily Security & Performance Tests

on:
  # Automated run every day at 06:00 UTC
  schedule:
    - cron: '0 6 * * *'

  # Enables manual execution button under GitHub Actions tab
  workflow_dispatch:

jobs:
  test:
    name: Run k6 Security Validation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Execute k6 Test Suite
        env:
          ENVIRONMENT_URL: ${{ secrets.ENVIRONMENT_URL }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          chmod +x run-test.sh
          ./run-test.sh security_policy_test
